
name: CloudRender Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    name: Render 3D Animation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4 remotely
        run: npm run render

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: CloudRender-Animation
          path: out/animation.mp4
          if-no-files-found: error
          retention-days: 7
          
